# Routing-as-CLI: same priority → tie-break by pattern specificity.
description: 'route: same priority matchers → longest pattern wins'
runner: 'route'
status: 'active'
input:
  cwd: '{HOME}/Music/myskills/packages/harness-cli'
  marker_file: null
  available_profiles:
    - name: 'harness'
      description: 'broader scope'
      detection:
        priority: 10
        matchers:
          - type: 'path_glob'
            pattern: '~/Music/myskills/**'
      entry_skill: 'profile-entry'
      task_types:
        quick: 'harness-quick'
        bugfix: 'harness-bugfix'
        feature: 'harness-feature'
        refactor: 'harness-refactor'
      default_mode: 'standard'
      hard_floor: []
    - name: 'harness-cli'
      description: 'narrower scope wins on specificity'
      detection:
        priority: 10
        matchers:
          - type: 'path_glob'
            pattern: '~/Music/myskills/packages/harness-cli/**'
      entry_skill: 'profile-entry'
      task_types:
        quick: 'harness-quick'
        bugfix: 'harness-bugfix'
        feature: 'harness-feature'
        refactor: 'harness-refactor'
      default_mode: 'standard'
      hard_floor: []
  task_description: '调整 schema'
  flags: []
expected_output:
  leaf_skill: 'harness-feature'
  resolved_profile: 'harness-cli'
  resolved_mode: 'standard'
  hard_floor: []
  fast_path_hit: false
