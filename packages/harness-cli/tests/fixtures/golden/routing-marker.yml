# Routing-as-CLI: marker explicit → skip fallback matchers entirely.
description: 'route: explicit marker → matcher fallback skipped'
runner: 'route'
status: 'active'
input:
  cwd: '{HOME}/Music/myskills'
  marker_file:
    profile: 'harness'
    resolved_by: 'marker'
    updated_at: '2026-04-26T10:00:00Z'
  available_profiles:
    - name: 'harness'
      description: 'personal'
      detection:
        priority: 10
        matchers:
          - type: 'path_glob'
            pattern: '~/Music/myskills/**'
      entry_skill: 'profile-entry'
      task_types:
        quick: 'harness-quick'
        bugfix: 'harness-bugfix'
        feature: 'harness-feature'
        refactor: 'harness-refactor'
      default_mode: 'standard'
      hard_floor: []
    - name: 'company-foo'
      description: 'should be ignored when marker pins harness'
      detection:
        priority: 100
        matchers:
          - type: 'path_glob'
            pattern: '~/**'
      entry_skill: 'profile-entry'
      task_types:
        quick: 'harness-quick'
        bugfix: 'harness-bugfix'
        feature: 'harness-feature'
        refactor: 'harness-refactor'
      default_mode: 'conservative'
      hard_floor: ['auto_push', 'force_push']
  task_description: '加一个登录按钮'
  flags: []
expected_output:
  leaf_skill: 'harness-feature'
  resolved_profile: 'harness'
  resolved_mode: 'standard'
  hard_floor: []
  fast_path_hit: false
