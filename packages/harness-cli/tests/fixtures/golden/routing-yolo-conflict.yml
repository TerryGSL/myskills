# Routing-as-CLI: /yolo flag tries to enable aggressive but company hard_floor caps the mode.
description: 'route: /yolo conflicts with company hard_floor → mode capped, hard_floor preserved'
runner: 'route'
status: 'active'
input:
  cwd: '{HOME}/work/company-foo'
  marker_file:
    profile: 'company-foo'
    resolved_by: 'marker'
    updated_at: '2026-04-26T10:00:00Z'
  available_profiles:
    - name: 'company-foo'
      description: 'company profile with hard_floor'
      detection:
        priority: 100
        matchers:
          - type: 'path_glob'
            pattern: '~/work/company-foo/**'
      entry_skill: 'profile-entry'
      task_types:
        quick: 'harness-quick'
        bugfix: 'harness-bugfix'
        feature: 'harness-feature'
        refactor: 'harness-refactor'
      default_mode: 'conservative'
      hard_floor: ['auto_push', 'force_push']
  task_description: '加 feature'
  flags: ['yolo']
expected_output:
  leaf_skill: 'harness-feature'
  resolved_profile: 'company-foo'
  resolved_mode: 'conservative'
  hard_floor: ['auto_push', 'force_push']
  fast_path_hit: false
