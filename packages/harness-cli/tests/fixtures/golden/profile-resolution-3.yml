# Profile resolution: same priority → tie-break by pattern specificity (longer / more literal wins).
description: 'profile-entry tie-breaks same-priority matchers by specificity (longest pattern wins)'
runner: 'profile-resolve'
status: 'active'
input:
  # {HOME} replaced by tmpdir; CLI invoked with HOME={HOME}.
  cwd: '{HOME}/Music/myskills/packages/harness-cli'
  marker_file: null
  available_profiles:
    - name: 'harness'
      description: 'personal'
      detection:
        priority: 10
        matchers:
          - type: 'path_glob'
            pattern: '~/Music/myskills/**'
      entry_skill: 'profile-entry'
      task_types:
        quick: 'harness-quick'
        bugfix: 'harness-bugfix'
        feature: 'harness-feature'
        refactor: 'harness-refactor'
      default_mode: 'standard'
      hard_floor: []
    - name: 'harness-cli'
      description: 'sub-project'
      detection:
        priority: 10
        matchers:
          - type: 'path_glob'
            pattern: '~/Music/myskills/packages/harness-cli/**'
      entry_skill: 'profile-entry'
      task_types:
        quick: 'harness-quick'
        bugfix: 'harness-bugfix'
        feature: 'harness-feature'
        refactor: 'harness-refactor'
      default_mode: 'standard'
      hard_floor: []
expected_output:
  profile_name: 'harness-cli'
  resolved_by: 'matcher'
  matched_pattern: '~/Music/myskills/packages/harness-cli/**'
