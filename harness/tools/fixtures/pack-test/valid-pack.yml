# valid-pack.yml — fixture for harness-pack-test contract validation tests.
# This file is intentionally fully compliant with the task-type-contract.

name: acme-backend
description: "Company profile for Acme Corp backend monorepo (Go + gRPC)"

detection:
  priority: 10
  matchers:
    - type: repo_path
      pattern: "~/work/acme-api"
    - type: git_remote
      pattern: "github.com/acme"

entry_skill: profile-entry

task_types:
  quick:    harness-quick
  bugfix:   harness-bugfix
  feature:  harness-feature
  refactor: harness-refactor

default_mode: standard

hard_floor:
  - auto_push
  - auto_merge
